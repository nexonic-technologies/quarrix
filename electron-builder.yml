appId: com.nexonictechnologies.quarrix
productName: Quarrix
copyright: Copyright © 2026 Nexonic Technologies
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - bin/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  - bin/**
publish:
  provider: github
  owner: nexonic-technologies
  repo: quarrix
  releaseType: draft
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  artifactName: Quarrix-${version}-mac-${arch}.${ext}
  # Needed for notarization; only takes effect when a signing certificate is present.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: Quarrix ${version}
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  artifactName: Quarrix-${version}-windows-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  target: [AppImage, deb]
  category: Office
  icon: build/icon.png
  maintainer: Nexonic Technologies <info@nexonictechnologies.com>
  artifactName: Quarrix-${version}-linux-${arch}.${ext}
