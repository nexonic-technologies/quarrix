name: Android CI
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Opportunity logic tests
        working-directory: android
        run: |
          test_dir=$(mktemp -d)
          javac -d "$test_dir" app/src/main/java/com/nexonic/quarrix/Opportunity.java tests/OpportunityTest.java
          java -cp "$test_dir" com.nexonic.quarrix.OpportunityTest
      - name: Build and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:bundleRelease
      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: Quarrix-Android-1.0.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Quarrix-Android-1.0.0-unsigned-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
