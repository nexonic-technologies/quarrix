name: Release
# Builds the installers and publishes a GitHub release whenever the version in package.json changes on main.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: v
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # Each platform signs only when its own certificate is present (macOS also needs the notarization account).
      HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
      HAS_WIN_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libgbm1 libgtk-3-0 libxss1 xvfb >/dev/null
      # Installers are only built from code that passes the same checks as CI.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - id: sign
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_MAC_CERT" = true ]; then echo "signed=true" >> "$GITHUB_OUTPUT";
          elif [ "$RUNNER_OS" = Windows ] && [ "$HAS_WIN_CERT" = true ]; then echo "signed=true" >> "$GITHUB_OUTPUT";
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
      # Unsigned build. Signing variables must be absent, not empty: an empty CSC_LINK is read as the project folder ("not a file").
      # Installers go to a draft release; it is published only after every platform's installed-app smoke test passes.
      - name: Build installers (unsigned)
        if: steps.sign.outputs.signed != 'true'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build installers (signed and notarized)
        if: steps.sign.outputs.signed == 'true' && runner.os == 'macOS'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build installers (signed)
        if: steps.sign.outputs.signed == 'true' && runner.os == 'Windows'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Signature checks: a signed build that fails verification fails the release.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for APP in dist/mac-arm64/Quarrix.app dist/mac/Quarrix.app; do
          [ -d "$APP" ] || exit 1
          ARCH=$(lipo -archs "$APP/Contents/MacOS/Quarrix")
          if [ "${{ steps.sign.outputs.signed }}" = true ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
            xcrun stapler validate "$APP"
            echo "macOS $ARCH: signed with Developer ID and notarized" | tee -a signing.txt
          else
            if DETAILS=$(codesign -dv "$APP" 2>&1); then
              printf '%s\n' "$DETAILS"
              if grep -q 'Signature=adhoc' <<< "$DETAILS"; then
                echo "macOS $ARCH: ad-hoc signature only (not Developer ID signed)" | tee -a signing.txt
              else
                echo "Unexpected signature on $ARCH build without configured signing credentials"; exit 1
              fi
            elif grep -q 'code object is not signed at all' <<< "$DETAILS"; then
              echo "macOS $ARCH: unsigned (no code signature)" | tee -a signing.txt
            else
              printf '%s\n' "$DETAILS"; exit 1
            fi
          fi
          done
      - name: Verify Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            $exe = Get-ChildItem dist -Filter "*-$arch-setup.exe" | Select-Object -First 1
            if (-not $exe) { throw "Missing $arch installer" }
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ("${{ steps.sign.outputs.signed }}" -eq "true") { if ($sig.Status -ne "Valid") { throw "Signature status: $($sig.Status)" }; "Windows ${arch}: signed by $($sig.SignerCertificate.Subject)" | Tee-Object -Append signing.txt }
            else { "Windows ${arch}: unsigned (actual signature status $($sig.Status))" | Tee-Object -Append signing.txt }
          }
      # Installed-app smoke test: install with the real installer, start the installed app, check it end to end (src/main/smoke.ts).
      - name: Smoke test the installed app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/q "$(ls dist/*-mac-arm64.dmg)"
          cp -R /tmp/q/Quarrix.app /tmp/Quarrix.app && hdiutil detach /tmp/q
          QUARRIX_SMOKE_OUT="$PWD/smoke-mac.json" /tmp/Quarrix.app/Contents/MacOS/Quarrix || (cat smoke-mac.json; exit 1)
          cat smoke-mac.json
      - name: Smoke test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "*-x64-setup.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Quarrix\Quarrix.exe"
          $env:QUARRIX_SMOKE_OUT = "$PWD\smoke-windows.json"
          Start-Process $exe -Wait
          # Start-Process often reports no exit code for GUI apps, so the report itself decides.
          if (-not (Test-Path smoke-windows.json)) { throw "the app wrote no smoke report" }
          Get-Content smoke-windows.json
          if (-not (Get-Content smoke-windows.json -Raw | ConvertFrom-Json).ok) { throw "smoke test failed" }
      - name: Smoke test the installed app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq "./$(ls dist/*-linux-amd64.deb)" >/dev/null
          BIN="$(dpkg -L quarrix | grep -E '/opt/.*/quarrix$' | head -1)"
          QUARRIX_SMOKE_OUT="$PWD/smoke-linux.json" xvfb-run -a "$BIN" --no-sandbox || (cat smoke-linux.json; exit 1)
          cat smoke-linux.json
      # Every shipped architecture is checked (0.25): the binary's CPU type, and a second installed-app run where the runner can.
      - name: Verify architectures (macOS Intel and Apple Silicon)
        if: runner.os == 'macOS'
        timeout-minutes: 12
        shell: bash
        run: |
          A=$(lipo -archs dist/mac-arm64/Quarrix.app/Contents/MacOS/Quarrix); X=$(lipo -archs dist/mac/Quarrix.app/Contents/MacOS/Quarrix)
          [ "$A" = arm64 ] && [ "$X" = x86_64 ] || { echo "wrong CPU types: arm64 build=$A, Intel build=$X"; exit 1; }
          echo "macOS: Apple Silicon build is arm64, Intel build is x86_64" | tee -a signing.txt
          # Native Intel installed-app validation is a separate required job, avoiding Rosetta display hangs.
      - name: Verify architectures (Windows ARM64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Machine($f) { $b = [IO.File]::ReadAllBytes($f); $pe = [BitConverter]::ToInt32($b, 0x3c); '{0:X4}' -f [BitConverter]::ToUInt16($b, $pe + 4) }
          $x = Machine "dist\win-unpacked\Quarrix.exe"; $a = Machine "dist\win-arm64-unpacked\Quarrix.exe"
          if ($x -ne "8664" -or $a -ne "AA64") { throw "wrong CPU types: x64 build=$x, ARM64 build=$a" }
          if (-not (Get-ChildItem dist -Filter "*-arm64-setup.exe")) { throw "no ARM64 installer" }
          "Windows: x64 build is AMD64, ARM64 build is ARM64 (native installed-app validation below)" | Tee-Object -Append signing.txt
      - name: Smoke test the AppImage (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          IMG="$(ls dist/*.AppImage | head -1)"; chmod +x "$IMG"
          QUARRIX_SMOKE_OUT="$PWD/smoke-linux-appimage.json" APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$IMG" --no-sandbox || (cat smoke-linux-appimage.json; exit 1)
          echo "Linux: AppImage installed-app smoke test passed" | tee -a signing.txt
      - name: Preserve platform-specific verification report
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then echo "Linux: no installer code signature; SHA-256 checksums published separately" >> signing.txt; fi
          if [ -f signing.txt ]; then mv signing.txt "signing-$RUNNER_OS.txt"; fi
      - name: Attach smoke reports and signing status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ runner.os }}
          path: |
            smoke-*.json
            signing-*.txt
          if-no-files-found: ignore
  # Validate the actual draft installers on native CPUs before publishing.
  native-smoke:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            pattern: '*-mac-x64.dmg'
          - os: windows-11-arm
            pattern: '*-arm64-setup.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Download draft installer
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', TAG: '${{ needs.version.outputs.tag }}', REPO: '${{ github.repository }}', PATTERN: '${{ matrix.pattern }}' }
        run: gh release download "$TAG" -R "$REPO" --pattern "$PATTERN" --dir installers
      - name: Smoke test native Intel macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/q-native "$(ls installers/*.dmg)"
          cp -R /tmp/q-native/Quarrix.app /tmp/QuarrixNative.app
          hdiutil detach /tmp/q-native
          QUARRIX_SMOKE_OUT="$PWD/smoke-mac-x64.json" /tmp/QuarrixNative.app/Contents/MacOS/Quarrix
          node -e 'const r=require("./smoke-mac-x64.json"); if (!r.ok || r.arch !== "x64") process.exit(1)'
      - name: Smoke test native Windows ARM64 installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter '*-arm64-setup.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with $($p.ExitCode)" }
          $env:QUARRIX_SMOKE_OUT = "$PWD\smoke-windows-arm64.json"
          Start-Process "$env:LOCALAPPDATA\Programs\Quarrix\Quarrix.exe" -Wait
          $r = Get-Content $env:QUARRIX_SMOKE_OUT -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.arch -ne 'arm64') { throw 'ARM64 smoke test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-native-${{ matrix.os }}
          path: smoke-*.json
          if-no-files-found: error
  # Live checks of the keyless providers with the app's own code (GitHub runners have internet access). A report, not a gate.
  live:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libgbm1 libgtk-3-0 libxss1 >/dev/null
      - run: LIVE_OUT=live-providers.json node scripts/live.mjs
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        with: { name: verification-live, path: live-providers.json }
  checksums:
    needs: [version, build, native-smoke, live]
    if: always() && needs.build.result == 'success' && needs.native-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: verification, pattern: verification-*, merge-multiple: true }
      - name: Package the browser extension
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', TAG: '${{ needs.version.outputs.tag }}', REPO: '${{ github.repository }}' }
        run: |
          cd extension && zip -r "../Quarrix-${TAG#v}-browser-extension.zip" . && cd ..
          gh release upload "$TAG" "Quarrix-${TAG#v}-browser-extension.zip" -R "$REPO" --clobber
      - name: Publish SHA-256 checksums for every installer
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', TAG: '${{ needs.version.outputs.tag }}', REPO: '${{ github.repository }}' }
        run: |
          mkdir -p a && cd a
          gh release download "$TAG" -R "$REPO" --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb' --pattern '*-browser-extension.zip'
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$REPO" --clobber
      # Every platform built, verified its signature state and passed the installed-app smoke test: publish the draft,
      # with the real signing state and smoke results in the notes.
      - name: Publish the release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', TAG: '${{ needs.version.outputs.tag }}', REPO: '${{ github.repository }}' }
        run: |
          {
            if [ "$TAG" = v3.5.0 ]; then
              echo "## Quarrix 3.5 — Career, Business and Desktop Productivity"
              echo
              echo "- Official regional sources, offline CV/portfolio/application templates, separate quotes and currency-specific forecasting."
              echo "- Universal search, favorites, dashboard preferences and verified backup recovery."
              echo
            elif [ "$TAG" = v3.0.0 ]; then
              echo "## Quarrix 3.0 — Universal Opportunity Platform"
              echo
              echo "- Recent public company registrations, scoped signals and deduplicated local observation trends."
              echo "- Unified priority queue, three-week career learning plans and saved interview worksheet."
              echo "- Free-first, local-first experience with no automatic application or outreach."
              echo
            elif [ "$TAG" = v2.7.0 ]; then
              echo "## Quarrix 2.7 — Global data, evidence and offline intelligence"
              echo
              echo "- Combined v2.3–v2.7 improvements: public register lookups, NYC external vacancies, evidence coverage, local CV recommendations, bounded dated cache and accessible quality views."
              echo
            elif [ "$TAG" = v2.2.0 ]; then
              echo "## Quarrix 2.2 — Free-First Intelligence"
              echo
              echo "- Keyless discovery and local tools remain available; optional keyed discovery, verification and remote writing require explicit opt-in. Existing keys are preserved."
              echo "- Positive daily request ceilings for named metered services; zero pauses them. Backup writing providers require separate consent. Provider billing terms still apply."
              echo
            elif [ "$TAG" = v2.1.0 ]; then
              echo "## Quarrix 2.1 — User experience and data reliability"
              echo
              echo "- Guided onboarding progress, accessible keyboard navigation and polished interactive discovery cards."
              echo "- Dated on-demand reachability checks, scoped duplicate suggestions and actionable evidence review."
              echo "- Debounced local search and explicit load recovery. Reachability is not a guarantee of successful search results."
              echo
            elif [ "$TAG" = v2.0.1 ]; then
              echo "## Quarrix 2.0.1 — Overpass resilience"
              echo
              echo "- Bounded retries for transient provider errors; access refusals, throttling, budgets and cancellation remain respected."
              echo "- Smaller live probe and clearer incomplete-response handling. Signing remains conditional on valid credentials."
              echo
            elif [ "$TAG" = v2.0.0 ]; then
              echo "## Quarrix 2.0 — Unified opportunity intelligence"
              echo
              echo "- Public regional directories, SEC operating-company lookup and real BLS wage observations. Directory links are not automated data connectors."
              echo "- Resume skill evidence, learning links and upcoming application dates."
              echo "- Business segmentation, sample competitor comparisons, currency-separated sales and proposal validity/discounts."
              echo "- Daily opportunity center, opt-in local reminders and saved-search controls."
              echo "- Lazy-loaded discovery screens, visibility-aware dashboard refresh, and accessibility regression checks."
              echo
            elif [ "$TAG" = v1.1.0 ]; then
              echo "## Quarrix Verified Intelligence & Simplified Experience"
              echo
              echo "- Two primary entry points: Find customers and Find a job; existing advanced tools remain available."
              echo "- Evidence and freshness labels, on-demand GLEIF legal-entity candidate lookup, and vacancy review warnings."
              echo "- Local recommendations based on recorded fit and evidence; advertised annualized salary comparisons by currency."
              echo "- Registry listings do not confirm contacts, websites or vacancies. Advertised salary samples are not market averages."
              echo
            elif [ "$TAG" = v1.0.1 ]; then
              echo "## Quarrix 1.0.1 — Desktop polish and reliability"
              echo
              echo "- Refined typography, navigation, responsive layouts and workspace-specific dashboards."
              echo "- Safe navigation and client switching, stale-result protection, canonical localized form values and duplicate watchlist protection."
              echo "- Accurate dashboard charts, improved loading states and desktop regression checks in CI."
              echo "- Previously documented external requirements remain unchanged."
              echo
            elif [ "$TAG" = v1.0.0 ]; then
              echo "## Quarrix 1.0 — Proposal and Public Opportunity Studios"
              echo
              echo "- Editable local proposals, itemized quotations, templates, status tracking and PDF/Word exports."
              echo "- Branded market reports from stored samples; official government job and procurement portal directory."
              echo "- Recent standard EU contract notices via the official API and local deadline/checklist watchlist."
              echo "- Combines milestones 0.31 and 0.32 into the production release; no automatic submission."
              echo "- Previously documented partner/API/signing blockers remain external requirements."
              echo
            elif [ "$TAG" = v0.30.0 ]; then
              echo "## Business and Market Intelligence"
              echo
              echo "- Compare recorded businesses by category, country, city, source and linked company."
              echo "- Distinguish linked companies, locations, data coverage, recency and recorded fit."
              echo "- Workspace-scoped local analysis and aggregate CSV export; no market-size or revenue claims."
              echo
            elif [ "$TAG" = v0.29.0 ]; then
              echo "## Resume, Interview and Application Studio"
              echo
              echo "- Text-based resume review, skill evidence and interview practice prompts."
              echo "- Per-application notes and document drafts, deadlines and follow-up planner."
              echo "- Local storage, explicit user review, no automatic application submission."
              echo
            elif [ "$TAG" = v0.28.0 ]; then
              echo "## Job Trust and Employer Verification"
              echo
              echo "- Explainable job trust evidence and contextual recruitment warnings."
              echo "- Check whether an independently known employer careers page lists the exact vacancy."
              echo "- No scam verdicts from unavailable pages, no credentials or CV sent by the checker."
              echo
            elif [ "$TAG" = v0.27.0 ]; then
              echo "## Career Intelligence"
              echo
              echo "Quarrix — Discover Opportunities. Build Your Career. Grow Your Business."
              echo "- Explore 1,016 real occupations offline, with or without a CV."
              echo "- Review matching evidence and relevant skills, then search available jobs."
              echo "- Career exploration runs locally without a mandatory account or external processing."
              echo
            elif [ "$TAG" = v0.26.1 ]; then
              echo "## Hardening changes"
              echo
              echo "- Persistent email allowance reservations and correct proof-report mailbox attribution."
              echo "- Conflict-safe CRM merge and undo, plus location-aware duplicate groups."
              echo "- Partial provider-result warnings and architecture-specific installer verification."
              echo
            fi
            echo "## Verification"
            echo
            for f in verification/signing-*.txt; do [ -f "$f" ] || continue; sed 's/^/- /' "$f"; done
            for f in verification/smoke-*.json; do node -e "const r=require('./'+process.argv[1]); console.log('- Installed-app smoke test, '+r.platform+' '+r.arch+(process.argv[1].includes('appimage')?' (AppImage)':process.argv[1].includes('linux')?' (deb)':'')+': '+r.checks.filter(c=>c.ok).length+'/'+r.checks.length+' checks passed')" "$f"; done
            if [ -f verification/live-providers.json ]; then
              node -e "const r=require('./verification/live-providers.json'); console.log('- Live provider checks (keyless sources, from CI): '+r.passed+'/'+r.total+' answered with real data; '+(r.outages||0)+' temporary provider outages; '+(r.failures||0)+' failures. Details: live-providers.json'); for (const x of r.results.filter(x=>!x.ok)) console.log('  - '+(x.kind==='outage'?'Outage (provider busy or unreachable), ':'Failure, ')+x.check+': '+x.detail)"
              gh release upload "$TAG" verification/live-providers.json -R "$REPO" --clobber
            fi
            echo
            echo "Checksums: SHA256SUMS.txt. Unsigned builds: see docs/RELEASING.md for how to open them."
          } > notes.md
          gh release edit "$TAG" -R "$REPO" --notes-file notes.md --draft=false --latest
