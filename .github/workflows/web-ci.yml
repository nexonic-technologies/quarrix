name: Web CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: quarrix_test
          MYSQL_USER: quarrix_test
          MYSQL_PASSWORD: local-ci-only
        ports: [3306:3306]
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm test
        env:
          DATABASE_URL: mysql://quarrix_test:local-ci-only@127.0.0.1:3306/quarrix_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: php -l wordpress/quarrix-admin/quarrix-admin.php
